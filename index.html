<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <title>Carrello</title>
</head>
<body>

    <div class="card mx-auto my-5" style="width: 30rem;">
        <div class="card-body text-center">
            <h1 class="card-title">🛒 Il mio carrello</h1>
            <p class="card-text">Aggiungi un prodotto al carrello</p>
            <input id="prezzoInput" type="text" placeholder="Inserisci prezzo"><br>
            <button type="button" onclick="Prodotto()" class="btn bg-black text-white">Aggiungi prodotto</button>
            <button type="button" onclick="zero()" class="btn btn-danger text-white">Reset</button>
            <p class="bg-secondary my-3">Totale: <span id="display">0</span>€</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</body>
</html>
